name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run build

      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          case "${VERSION}" in
            "${PACKAGE_VERSION}"|"${PACKAGE_VERSION}".*) ;;
            *)
              echo "Release tag version (${VERSION}) must match package.json version (${PACKAGE_VERSION}) or add a dot suffix such as ${PACKAGE_VERSION}.1." >&2
              exit 1
              ;;
          esac

      - name: Prepare release artifacts
        run: mkdir -p release-artifacts

      - name: Create npm package tarball
        run: npm pack --pack-destination release-artifacts

      - name: Create dist archive
        run: tar -czf "release-artifacts/miku-repo-bundle-${GITHUB_REF_NAME}-dist.tar.gz" dist package.json README.md LICENSE docs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*
          overwrite_files: true
