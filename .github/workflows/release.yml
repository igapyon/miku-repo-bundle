name: Release CLI bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name, such as v0.5.0"
        required: true
        type: string

permissions:
  contents: write

env:
  PRODUCT_NAME: miku-repo-bundle
  RELEASE_ASSETS_DIR: release-assets

jobs:
  release:
    name: Build and publish CLI bundle
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          case "${VERSION}" in
            "${PACKAGE_VERSION}"|"${PACKAGE_VERSION}".*) ;;
            *)
              echo "Release tag version (${VERSION}) must match package.json version (${PACKAGE_VERSION}) or add a dot suffix such as ${PACKAGE_VERSION}.1." >&2
              exit 1
              ;;
          esac

      - name: Build CLI bundle
        run: npm run bundle

      - name: Smoke test CLI bundle
        run: npm run smoke:bundle

      - name: Prepare release assets
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          mkdir -p "${RELEASE_ASSETS_DIR}"
          cp "bundle/${PRODUCT_NAME}.mjs" "${RELEASE_ASSETS_DIR}/${PRODUCT_NAME}-${VERSION}.mjs"
          cp "bundle/${PRODUCT_NAME}-sources.tgz" "${RELEASE_ASSETS_DIR}/${PRODUCT_NAME}-sources-${VERSION}.tgz"

      - name: Verify release assets
        run: |
          set -euo pipefail
          test -s "${RELEASE_ASSETS_DIR}/${PRODUCT_NAME}-${TAG_NAME#v}.mjs"
          test -s "${RELEASE_ASSETS_DIR}/${PRODUCT_NAME}-sources-${TAG_NAME#v}.tgz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          files: ${{ env.RELEASE_ASSETS_DIR }}/*
          overwrite_files: true
